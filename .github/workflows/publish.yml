# Publish m3-sc to PyPI via Trusted Publishing (OIDC) -- no API tokens anywhere.
#
# One-time setup on pypi.org (do this BEFORE pushing the first tag):
#   pypi.org -> Your account -> Publishing -> "Add a pending publisher"
#     PyPI Project Name: m3-sc
#     Owner:             PYangLab
#     Repository:        M3
#     Workflow name:     publish.yml
#     Environment:       LEAVE BLANK
#
#   Nothing to configure on the GitHub side -- no environment, no secrets.
#   Environment matching is asymmetric: blank on PyPI matches any environment or
#   none, while an environment SET on PyPI requires the job to declare that same
#   name. So you can add a manual approval gate later -- `environment: pypi` on
#   the pypi job plus a repo environment of that name with a required reviewer --
#   without touching the publisher. Never the reverse.
#
# Release flow:
#   1. bump __version__ in src/m3/__init__.py (pyproject reads it via hatch)
#   2. git tag v0.3.0 && git push pyanglab v0.3.0
#
# There is deliberately NO TestPyPI rehearsal here, so the checks below are the
# only thing standing between a tag and a permanent upload -- a version number
# can never be reused on PyPI, even after a yank. Hence:
#   - the tag must match __version__, or the run fails before publishing
#   - the full test suite runs against the built wheel, not against the source
#     tree, so what gets tested is exactly what gets uploaded
#   - workflow_dispatch builds and tests but never publishes, so it is a safe
#     rehearsal. Note the pypi job is gated on the EVENT being a push, not just
#     on the ref being a tag: workflow_dispatch's ref selector accepts tags too,
#     so a ref-only guard would let a "rehearsal" against an existing tag upload
#     for real and burn that version number.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/m3/__init__.py').read_text()).group(1))")
          echo "tag=$tag  package=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag v$tag != version $pkg"; exit 1; }

      - name: Validate metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Install the built wheel and run the suite against it, so a packaging fault
  # (a missing module, unshipped demo data) fails here rather than on a user's
  # machine after the version is already burned.
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the wheel (not the source tree)
        run: |
          pip install dist/*.whl pytest
          pip list

      - name: Import check
        # src/ is not on sys.path, so this can only resolve to the installed wheel
        run: python -c "import m3; print('m3', m3.__version__, 'from', m3.__file__)"

      - name: Run the suite against the installed package
        run: python -m pytest tests/ -v

  pypi:
    needs: test
    # Pushed tags only. The event check is load-bearing: workflow_dispatch can be
    # aimed at a tag, so guarding on the ref alone would let a manual "rehearsal"
    # publish for real. With this, a dispatch run always stops after build + test.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
